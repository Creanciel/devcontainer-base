name: Release web
run-name: Release web (${{ github.sha }})

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: web

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase namespace
        id: namespace
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "value=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: version
        env:
          VERSION_FILE: docker/web/VERSION
        run: |
          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error file=$VERSION_FILE::$VERSION_FILE not found"
            exit 1
          fi
          version="$(tr -d '[:space:]' < "$VERSION_FILE")"
          if [ -z "$version" ]; then
            echo "::error file=$VERSION_FILE::$VERSION_FILE is empty; write a version (e.g. 0.1.0) before releasing"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./docker/web
          file: ./docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
